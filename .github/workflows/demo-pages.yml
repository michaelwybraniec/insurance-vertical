# Build demo/static and deploy to GitHub Pages.
name: Deploy static demo

on:
  push:
    branches: [main, 001-mutuelle-enrolment-cotisations]
    paths:
      - 'demo/static/**'
      - 'web/**'
      - '.github/workflows/demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-demo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demo/static/package-lock.json
      - name: Install and build
        working-directory: demo/static
        env:
          VITE_BASE: /insurance-vertical/
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/static/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
